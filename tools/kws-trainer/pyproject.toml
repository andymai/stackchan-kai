[project]
name = "stackchan-kws-trainer"
version = "0.1.0"
description = "Host tooling for capturing wake-word training samples from a stackchan-kai device and turning them into a microWakeWord .tflite model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# `eval` brings in the TFLite runtime needed for `kws-eval` to
# invoke a trained model. Pulled in optionally so the recorder +
# dataset builder stay installable without an ML dep.
eval = [
    "ai-edge-litert>=1.0",
]

[project.scripts]
kws-record = "kws_trainer.cli.record:main"
kws-build-dataset = "kws_trainer.cli.build_dataset:main"
kws-eval = "kws_trainer.cli.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kws_trainer"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
