[package]
name = "stackchan-desktop-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Wire protocol for the Claude Desktop Hardware Buddy BLE bridge — newline-delimited JSON over Nordic UART Service (no_std + alloc)."
