[package]
name = "stackchan-sim"
version = "0.23.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless simulator for stackchan-core: runs modifiers against a fake clock for deterministic integration tests."
publish = false

[lints]
workspace = true

[dependencies]
stackchan-core = { path = "../stackchan-core" }
# Used by `Framebuffer` — the Vec<Rgb565>-backed `DrawTarget` that lets
# render-regression tests assert against `Avatar::draw` without hardware.
embedded-graphics = { workspace = true }
# Used by `TrackingScenario` to construct `TrackingObservation`s — the
# `candidates` field is a `heapless::Vec<TargetCandidate, 4>` and the
# helper needs to mint empty + populated values.
heapless = "0.8"

# Optional: the host visualiser binary depends on `eframe` (egui +
# winit). Only pulled in when the `viz` feature is on, so the default
# library build (and CI host tests) stay dep-light. We keep eframe's
# default features enabled — they include the Linux window-system
# backends (wayland + x11) winit needs to compile, plus `glow` for
# OpenGL rendering and the bundled default fonts.
eframe = { version = "0.35", optional = true }

# Optional: the `sc-config` host binary crafts + validates a
# `STACKCHAN.RON` offline. Only pulled in when the `config-cli` feature
# is on, with `default-features` so the `parse` feature (serde derives +
# `parse_ron` / `render_ron`) is active. The default library build stays
# on the dep-light `default-features = false` dev-dependency below.
stackchan-net = { path = "../stackchan-net", optional = true }

[dev-dependencies]
# Used by `tests/ble_remote_command.rs` to round-trip raw BLE
# characteristic payloads through the same decoder the firmware uses.
stackchan-net = { path = "../stackchan-net", default-features = false }

[features]
# Default: lib-only, no GUI dep tree.
default = []
# Enable the `viz` binary (`cargo run -p stackchan-sim --bin viz --features viz`).
viz = ["dep:eframe"]
# Enable the `sc-config` binary
# (`cargo run -p stackchan-sim --bin sc-config --features config-cli`).
config-cli = ["dep:stackchan-net"]

[[bin]]
name = "viz"
path = "src/bin/viz.rs"
required-features = ["viz"]

[[bin]]
name = "sc-config"
path = "src/bin/config.rs"
required-features = ["config-cli"]
