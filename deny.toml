# cargo-deny configuration for stackchan-kai.
# See https://embarkstudios.github.io/cargo-deny/ for schema documentation.

[graph]
# Default features only. Optional dev-tooling features (e.g. the `viz`
# feature on `stackchan-sim` that pulls in the eframe/egui/winit GUI
# stack) are excluded from supply-chain checks because they ship as
# opt-in tools rather than runtime dependencies. The
# `*-bench`/`*-tools`/`viz` feature gates exist precisely so license
# constraints, MSRV, and binary-size budgets apply only to shipped
# code.
all-features = false

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # crypto-bigint 0.5.5 <- elliptic-curve 0.13 <- p256 0.13 <- trouble-host,
    # behind its `security` feature (LE Secure Connections pairing). Every
    # trouble-host release through 0.8.0 requires p256 ^0.13.2 and
    # crypto-bigint has no 0.5.x fix.
    # TODO: drop this entry once trouble-host depends on p256 >= 0.14.
    { id = "RUSTSEC-2026-0387", reason = "no fixed crypto-bigint reachable: trouble-host pins p256 ^0.13.2" },
]

[licenses]
version = 2
# Only licenses actually present in the resolved host dep graph. Add
# entries here when a new dep introduces a license, not pre-emptively;
# cargo-deny warns on unused allowances and CI surfaces those quickly.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    # `smoltcp` and `managed`, pulled in transitively by embassy-net,
    # ship under the BSD Zero Clause licence.
    "0BSD",
]
confidence-threshold = 0.8

[bans]
# esp-hal + embassy dep trees bring in transitive duplicates; warn rather than fail.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # esp-hal and its ecosystem occasionally land fixes on git before crates.io;
    # add specific URLs here only when strictly necessary, and document why.
]

[sources.allow-org]
github = []
